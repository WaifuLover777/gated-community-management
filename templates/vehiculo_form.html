{% extends "base.html" %}
{% block title %}Registrar Vehículo{% endblock %}
{% block page_title %}Registrar Vehículo{% endblock %}
{% block content %}
<div class="card" style="max-width:600px">
  <div class="card-header">
    <h3>🚗 Registrar Vehículo</h3>
    <a href="/residentes/vehiculos" class="btn btn-outline btn-sm">← Volver</a>
  </div>
  <div class="card-body">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-grid">
        <div class="form-group">
          <label>Residente *</label>
          <select name="residente_id" required>
            <option value="">— Seleccionar —</option>
            {% for r in residentes %}
            <option value="{{ r.id }}">{{ r.nombre }} (Casa {{ r.numero }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Placa *</label>
          <input type="text" name="placa" required placeholder="Ej: ABC-1234"
                 pattern="[A-Za-z]{3}-?[0-9]{3,4}" maxlength="8" title="Formato ABC-1234"
                 style="text-transform:uppercase">
        </div>
        <div class="form-group">
          <label>Marca</label>
          <input type="text" name="marca" maxlength="40" placeholder="Ej: Toyota">
        </div>
        <div class="form-group">
          <label>Modelo</label>
          <input type="text" name="modelo" maxlength="10" placeholder="Ej: Corolla">
        </div>
        <div class="form-group">
          <label>Color</label>
          <input type="text" name="color" maxlength="30" placeholder="Ej: Blanco">
        </div>
      </div>
      <div class="flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary">✅ Registrar Vehículo</button>
        <a href="/residentes/vehiculos" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
